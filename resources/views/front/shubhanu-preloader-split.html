  <style>
    /* ---------- SHUBHANU PRELOADER CSS START ---------- */

    html.sp-lock,
    html.sp-lock body {
      overflow: hidden !important;
    }

    #sp,
    #sp * {
      box-sizing: border-box;
    }

    #sp {
      --sp-bg: #ffffff;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 2147483000 !important;
      overflow: hidden !important;
      background: transparent;
      animation: sp-failsafe 0s linear 7s forwards;
    }

    #sp .sp-lid {
      position: absolute !important;
      left: -5% !important;
      width: 110% !important;
      height: 75% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: var(--sp-bg) !important;
      transition: transform .7s cubic-bezier(.7, 0, .2, 1);
    }

    #sp .sp-lt {
      top: 0 !important;
      border-radius: 0 0 50% 50% / 0 0 30% 30%;
    }

    #sp .sp-lb {
      bottom: 0 !important;
      border-radius: 50% 50% 0 0 / 30% 30% 0 0;
    }

    #sp svg {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      width: min(44vw, 240px) !important;
      max-width: none !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block;
      transform: translate(-50%, -50%);
      overflow: visible;
      transition: transform .45s ease-in, opacity .35s ease-in;
    }

    #sp .sp-d {
      fill: none;
      stroke: #fff;
      stroke-dasharray: 1 1;
      stroke-dashoffset: 1;
      animation: sp-draw .7s cubic-bezier(.65, 0, .35, 1) forwards;
    }

    #sp .sp-d-s {
      animation-delay: .1s;
    }

    #sp .sp-d-lidT,
    #sp .sp-d-lidB {
      animation-delay: .55s;
      animation-duration: .65s;
    }

    #sp .sp-d-arcT,
    #sp .sp-d-arcB {
      animation-delay: .95s;
      animation-duration: .45s;
    }

    #sp .sp-ray {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 50% 50%;
      transform: scale(.72);
      animation: sp-ray .42s cubic-bezier(.3, 1.5, .5, 1) forwards, sp-glow 1.6s ease-in-out infinite;
    }

    #sp .sp-r1 { --d: 1.2s; }
    #sp .sp-r2 { --d: 1.26s; }
    #sp .sp-r3 { --d: 1.32s; }
    #sp .sp-r4 { --d: 1.38s; }
    #sp .sp-r5 { --d: 1.44s; }
    #sp .sp-r6 { --d: 1.5s; }

    #sp .sp-ray {
      animation-delay: var(--d), calc(var(--d) + .8s);
    }

    #sp.sp-out svg {
      transform: translate(-50%, -50%) scale(1.1);
      opacity: 0;
    }

    #sp.sp-out .sp-lt {
      transform: translateY(-102%);
      transition-delay: .18s;
    }

    #sp.sp-out .sp-lb {
      transform: translateY(102%);
      transition-delay: .18s;
    }

    @keyframes sp-draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes sp-ray {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes sp-glow {
      50% { opacity: .45; }
    }

    @keyframes sp-failsafe {
      to { visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      #sp * {
        animation: none !important;
        transition: none !important;
      }
      #sp .sp-d { stroke-dashoffset: 0; }
      #sp .sp-ray { opacity: 1; transform: none; }
    }

    /* ---------- SHUBHANU PRELOADER CSS END ---------- */
  </style>
</head>

  <script>
    /* ---------- SHUBHANU PRELOADER JS START ---------- */

    (function () {
      var MIN_MS = 2000;          // kam se kam kitni der dikhana hai (ms)
      var MAX_MS = 6000;          // zyada se zyada kitni der (ms)
      var ONCE_PER_VISIT = true;  // true = ek session me sirf ek baar, false = har refresh par

      function spStart() {
        var el = document.getElementById('sp');
        var root = document.documentElement;
        var done = false;
        var seen = false;

        if (!el) return;

        try {
          seen = ONCE_PER_VISIT && sessionStorage.getItem('sp-seen');
        } catch (e) { }

        if (seen) {
          el.remove();
          return;
        }

        root.classList.add('sp-lock');
        var t0 = Date.now();

        function finish() {
          if (done) return;
          done = true;
          try { sessionStorage.setItem('sp-seen', '1'); } catch (e) { }
          el.classList.add('sp-out');
          root.classList.remove('sp-lock');
          setTimeout(function () { el.remove(); }, 1000);
        }

        function ready() {
          setTimeout(finish, Math.max(0, MIN_MS - (Date.now() - t0)));
        }

        if (document.readyState === 'complete') {
          ready();
        } else {
          window.addEventListener('load', ready);
        }

        setTimeout(finish, MAX_MS);
      }

      // DOM ready hone par chalao
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', spStart);
      } else {
        spStart();
      }
    })();

    /* ---------- SHUBHANU PRELOADER JS END ---------- */
  </script>
